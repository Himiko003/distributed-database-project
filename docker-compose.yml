services:
  postgres-primary:
    image: postgres:16
    container_name: sbdt-primary
    environment:
      POSTGRES_DB: sbdt_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password_dev
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./database/primary/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d sbdt_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sbdt-network

  postgres-replica:
    image: postgres:16
    container_name: sbdt-replica
    user: postgres
    environment:
      PGPASSWORD: replication_dev
      PRIMARY_HOST: postgres-primary
      PRIMARY_PORT: "5432"
      REPLICATION_USER: replicator
    entrypoint: ["/bin/bash", "/replica/replica-entrypoint.sh"]
    ports:
      - "5434:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./database/replica/replica-entrypoint.sh:/replica/replica-entrypoint.sh:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - sbdt-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sbdt-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_password
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - sbdt-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sbdt-backend
    environment:
      DB_WRITE_HOST: postgres-primary
      DB_READ_HOST: postgres-replica
      DB_PORT: "5432"
      DB_NAME: sbdt_db
      DB_USER: app_user
      DB_PASSWORD: app_password_dev
      KEYCLOAK_ISSUER: http://localhost:8080/realms/uts-sbdt
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/uts-sbdt/protocol/openid-connect/certs
    ports:
      - "8000:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - sbdt-network

volumes:
  primary_data:
  replica_data:

networks:
  sbdt-network:
    driver: bridge
